name: Regression and application checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare initial application source
        if: hashFiles('app.py') == ''
        env:
          SOURCE_ARCHIVE: 
        run: |
          python -c "import os,base64,zipfile,io; zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ['SOURCE_ARCHIVE']))).extractall('.')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py engine.py samples.py exports.py content.py requirements.txt README.md .gitignore .streamlit test_engine.py test_app.py gdp_pfce.csv SLR_Input_Template.xlsx
          git commit -m "Add generic SLR learning application, examples and Excel template"
          git push
      - run: pip install -r requirements.txt
      - run: python -m unittest test_engine test_app -v
